# Test / staging stack: PostgreSQL + one-shot migration + the API + Caddy (HTTPS, the web app and
# the install page). Usage and runbook: infra/README.md and docs/DEPLOY_TESTING.md
# Docker keeps every container's output forever by default; the API logs every request, so on a
# small disk that fills up and takes the whole server down. Keep a few small files instead.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ../backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate --noinput && python manage.py createcachetable"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ../backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Uploaded receipt photos and PDFs. Back this volume up together with the database.
      - privatefiles:/var/lib/erp/private_files
    depends_on:
      migrate:
        condition: service_completed_successfully

  # HTTPS (a free certificate for the domain in SITE_ADDRESS), the web app, the install page and
  # the Android app file. See infra/Caddyfile.
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  privatefiles:
  caddy_data:
  caddy_config:
