{% extends "console/page.html" %}
{% block content %}
<h1>{{ spec.title }}</h1>
<div class="panel">
  <p>Give this temporary password to the owner of <b>{{ client.business.name }}</b>. It is shown only now.
     They will be asked to choose their own the first time they sign in.</p>
  <p><span class="secret">{{ secret }}</span></p>
  <div class="btns">
    <a class="quiet" href="{% url 'console:billing_client_change' client.pk %}">Done</a>
  </div>
</div>
{% endblock %}
